<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FB ID & Username Converter</title>

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: -apple-system, sans-serif;
    background: #f0f2f5;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 30px 16px;
  }

  .card {
    background: white;
    border-radius: 16px;
    padding: 32px;
    width: 100%;
    max-width: 650px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.1);
    text-align: center;
    height: fit-content;
  }

  .logo {
    color: #1877f2;
    font-size: 26px;
    font-weight: bold;
    margin-bottom: 6px;
  }

  .sub {
    color: #888;
    margin-bottom: 20px;
    font-size: 13px;
  }

  textarea {
    width: 100%;
    padding: 12px 16px;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    font-size: 13px;
    outline: none;
    resize: vertical;
    min-height: 150px;
    font-family: monospace;
  }

  textarea:focus {
    border-color: #1877f2;
  }

  .main-btn {
    width: 100%;
    margin-top: 10px;
    padding: 13px;
    background: #1877f2;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }

  .main-btn:hover {
    background: #1565c0;
  }

  .main-btn:disabled {
    background: #b0c4e8;
    cursor: not-allowed;
  }

  .progress {
    margin-top: 10px;
    font-size: 13px;
    color: #888;
    display: none;
  }

  .bulk-results {
    margin-top: 16px;
    text-align: left;
    display: none;
    overflow-x: auto;
  }

  .bulk-results table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  .bulk-results th {
    background: #1877f2;
    color: white;
    padding: 10px;
    text-align: left;
    font-weight: 600;
  }

  .bulk-results td {
    padding: 10px;
    border-bottom: 1px solid #f0f0f0;
    vertical-align: middle;
  }

  .bulk-results tr:hover td {
    background: #f9f9f9;
  }

  .found {
    color: #2e7d32;
    font-weight: 600;
  }

  .notfound {
    color: #bbb;
  }

  .col-copy {
    display: inline-block;
    margin-left: 6px;
    font-size: 10px;
    color: #fff;
    cursor: pointer;
    font-weight: 400;
    border: 1px solid rgba(255,255,255,0.6);
    border-radius: 4px;
    padding: 1px 5px;
    user-select: none;
    opacity: 0.85;
  }

  .col-copy:hover {
    opacity: 1;
    background: rgba(255,255,255,0.2);
  }

  .copy-all {
    margin-bottom: 10px;
    padding: 8px;
    background: #f0f6ff;
    color: #1877f2;
    border: 1px solid #1877f2;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
  }

  .copy-all:hover {
    background: #ddeeff;
  }
</style>
</head>

<body>

<div class="card">

  <div class="logo">ID & Username Converter</div>

  <div id="bulk-panel">

    <textarea
      id="bulk-inp"
      placeholder="Нэг мөрт нэг утга (Username эсвэл ID)
zuck
100003645830763
mark.zuckerberg
..."></textarea>

    <button
      class="main-btn"
      id="bulk-btn"
      onclick="searchBulk()">
      Хөрвүүлэх
    </button>

    <div
      class="progress"
      id="progress">
    </div>

    <div
      class="bulk-results"
      id="bulk-results">

      <button
        class="copy-all"
        onclick="copyAll(this)">
        Бүх үр дүнг хуулах
      </button>

      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Хайсан утга</th>
            <th>
              UserID
              <span class="col-copy" onclick="copyCol('id',this)">copy</span>
            </th>
            <th>
              Username
              <span class="col-copy" onclick="copyCol('username',this)">copy</span>
            </th>
          </tr>
        </thead>
        <tbody id="bulk-tbody"></tbody>
      </table>
    </div>

  </div>

</div>

<script>

function _copyFallback(text) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;top:0;left:0;width:2px;height:2px;opacity:0.01;';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  ta.setSelectionRange(0, 99999);
  try { document.execCommand('copy'); } catch(e) {}
  document.body.removeChild(ta);
}

function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).catch(function() { _copyFallback(text); });
  } else {
    _copyFallback(text);
  }
}

function hasValue(v) {
  return v && v !== '0' && v !== 'Олдсонгүй';
}

var bulkResults = [];

function searchBulk() {
  var raw = document.getElementById('bulk-inp').value;
  var lines = raw.split('\n').map(function(s) { return s.trim(); }).filter(function(s) { return s.length > 0; });

  if (!lines.length) return;

  var btn = document.getElementById('bulk-btn');
  btn.disabled = true;
  btn.textContent = 'Хайж байна...';

  bulkResults = [];
  document.getElementById('bulk-tbody').innerHTML = '';
  document.getElementById('bulk-results').style.display = 'block';

  var prog = document.getElementById('progress');
  prog.style.display = 'block';
  prog.textContent = lines.length + ' хайлт илгээж байна...';

  fetch('/batch', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ items: lines })
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    var results = data.results || [];
    var tbody = document.getElementById('bulk-tbody');

    for (var i = 0; i < lines.length; i++) {
      var r = results[i] || {};

      bulkResults.push({
        query: lines[i],
        id: r.id || '',
        username: r.username || ''
      });

      var tr = document.createElement('tr');

      var cells = [
        { v: String(i + 1), style: 'color:#aaa;font-size:11px' },
        { v: lines[i], style: 'color:#555' },
        { v: r.id || '', cls: hasValue(r.id) ? 'found' : 'notfound' },
        { v: r.username || '', cls: hasValue(r.username) ? 'found' : 'notfound' }
      ];

      cells.forEach(function(c) {
        var td = document.createElement('td');
        td.textContent = c.v || '—';
        if (c.style) td.setAttribute('style', c.style);
        if (c.cls) td.className = c.cls;
        tr.appendChild(td);
      });

      tbody.appendChild(tr);
    }

    prog.textContent = '✓ Дууслаа! ' + lines.length + ' амжилттай хөрвүүллээ.';
    btn.disabled = false;
    btn.textContent = 'Хөрвүүлэх';
  })
  .catch(function(err) {
    console.error(err);
    prog.textContent = 'Алдаа гарлаа.';
    btn.disabled = false;
    btn.textContent = 'Хөрвүүлэх';
  });
}

function copyCol(key, el) {
  var text = bulkResults.map(function(x) { return x[key] || ''; }).join('\n');
  copyText(text);
  el.textContent = 'copied';
  setTimeout(function() { el.textContent = 'copy'; }, 1500);
}

function copyAll(btn) {
  var text = bulkResults.map(function(x) {
    return [x.id, x.username].join('\t');
  }).join('\n');

  copyText(text);
  var orig = btn.textContent;
  btn.textContent = 'Хуулагдлаа!';
  setTimeout(function() { btn.textContent = orig; }, 1500);
}

</script>

</body>
</html>
