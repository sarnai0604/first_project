<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FB ID Lookup - Bulk</title>

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: -apple-system, sans-serif;
    background: #f0f2f5;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 30px 16px;
  }

  .card {
    background: white;
    border-radius: 16px;
    padding: 32px;
    width: 100%;
    max-width: 1250px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.1);
    text-align: center;
    height: fit-content;
  }

  .logo {
    color: #1877f2;
    font-size: 26px;
    font-weight: bold;
    margin-bottom: 6px;
  }

  .sub {
    color: #888;
    margin-bottom: 20px;
    font-size: 13px;
  }

  textarea {
    width: 100%;
    padding: 12px 16px;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    font-size: 13px;
    outline: none;
    resize: vertical;
    min-height: 180px;
    font-family: monospace;
  }

  textarea:focus {
    border-color: #1877f2;
  }

  .main-btn {
    width: 100%;
    margin-top: 10px;
    padding: 13px;
    background: #1877f2;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }

  .main-btn:hover {
    background: #1565c0;
  }

  .main-btn:disabled {
    background: #b0c4e8;
    cursor: not-allowed;
  }

  .progress {
    margin-top: 10px;
    font-size: 13px;
    color: #888;
    display: none;
  }

  .bulk-results {
    margin-top: 16px;
    text-align: left;
    display: none;
    overflow-x: auto;
  }

  .bulk-results table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    white-space: nowrap;
  }

  .bulk-results th {
    background: #1877f2;
    color: white;
    padding: 9px 10px;
    text-align: left;
    font-weight: 600;
  }

  .bulk-results td {
    padding: 8px 10px;
    border-bottom: 1px solid #f0f0f0;
    vertical-align: middle;
  }

  .bulk-results tr:hover td {
    background: #f9f9f9;
  }

  .found {
    color: #2e7d32;
    font-weight: 600;
  }

  .notfound {
    color: #bbb;
  }

  .is-locked {
    color: #d32f2f;
    font-weight: bold;
  }

  .is-not-locked {
    color: #2e7d32;
    font-weight: 500;
  }

  .gender-male {
    color: #1565c0;
    font-weight: 600;
  }

  .gender-female {
    color: #c2185b;
    font-weight: 600;
  }

  .gender-unknown {
    color: #999;
    font-weight: 400;
  }

  .location-val {
    color: #555;
    font-weight: 500;
  }

  .col-copy {
    display: inline-block;
    margin-left: 6px;
    font-size: 10px;
    color: #fff;
    cursor: pointer;
    font-weight: 400;
    border: 1px solid rgba(255,255,255,0.6);
    border-radius: 4px;
    padding: 1px 5px;
    user-select: none;
    opacity: 0.85;
  }

  .col-copy:hover {
    opacity: 1;
    background: rgba(255,255,255,0.2);
  }

  .copy-all {
    margin-bottom: 10px;
    padding: 8px;
    background: #f0f6ff;
    color: #1877f2;
    border: 1px solid #1877f2;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
  }

  .copy-all:hover {
    background: #ddeeff;
  }
</style>
</head>

<body>

<div class="card">

  <div class="logo">FB ID Lookup</div>

  <div class="sub">
    Username / ID → мэдээлэл хайх
  </div>

  <!-- BULK SEARCH -->
  <div id="bulk-panel">

    <textarea
      id="bulk-inp"
      placeholder="Нэг мөрт нэг утга
100003645830763
100064320744716
61559556210474
61591508921232
..."></textarea>

    <button
      class="main-btn"
      id="bulk-btn"
      onclick="searchBulk()">
      Хайх
    </button>

    <div
      class="progress"
      id="progress">
    </div>

    <div
      class="bulk-results"
      id="bulk-results">

      <button
        class="copy-all"
        onclick="copyAll(this)">
        Бүх үр дүнг хуулах
      </button>

      <table>

        <thead>
          <tr>
            <th>#</th>
            <th>
              Username
              <span class="col-copy" onclick="copyCol('username',this)">copy</span>
            </th>
            <th>
              ID
              <span class="col-copy" onclick="copyCol('id',this)">copy</span>
            </th>
            <th>
              Friends
              <span class="col-copy" onclick="copyCol('friends',this)">copy</span>
            </th>
            <th>
              Followers
              <span class="col-copy" onclick="copyCol('followers',this)">copy</span>
            </th>
            <th>
              Following
              <span class="col-copy" onclick="copyCol('following',this)">copy</span>
            </th>
            <th>
              Gender
              <span class="col-copy" onclick="copyCol('gender',this)">copy</span>
            </th>
            <th>
              Locked
              <span class="col-copy" onclick="copyCol('is_closed',this)">copy</span>
            </th>
            <th>
              Deleted
              <span class="col-copy" onclick="copyCol('is_deleted',this)">copy</span>
            </th>
            <th>
              Location
              <span class="col-copy" onclick="copyCol('location',this)">copy</span>
            </th>
          </tr>
        </thead>

        <tbody id="bulk-tbody"></tbody>

      </table>
    </div>

  </div>

</div>


<script>

/* =========================================================
   COPY FUNCTIONS
========================================================= */

function _copyFallback(text) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText =
    'position:fixed;' +
    'top:0;' +
    'left:0;' +
    'width:2px;' +
    'height:2px;' +
    'opacity:0.01;';

  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  ta.setSelectionRange(0, 99999);

  try {
    document.execCommand('copy');
  } catch(e) {}

  document.body.removeChild(ta);
}

function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard
      .writeText(text)
      .catch(function() {
        _copyFallback(text);
      });
  } else {
    _copyFallback(text);
  }
}

/* =========================================================
   VALUE CHECK
========================================================= */

function hasValue(v) {
  return v &&
         v !== '0' &&
         v !== 'Олдсонгүй';
}

/* =========================================================
   GENDER CLASS
========================================================= */

function genderClass(g) {
  if (g === 'male')
    return 'gender-male';
  if (g === 'female')
    return 'gender-female';
  return 'gender-unknown';
}

/* =========================================================
   BULK RESULTS
========================================================= */

var bulkResults = [];

/* =========================================================
   BULK SEARCH
========================================================= */

function searchBulk() {
  var raw = document.getElementById('bulk-inp').value;

  var lines = raw
    .split('\n')
    .map(function(s) {
      return s.trim();
    })
    .filter(function(s) {
      return s.length > 0;
    });

  if (!lines.length)
    return;

  var btn = document.getElementById('bulk-btn');
  btn.disabled = true;
  btn.textContent = 'Хайж байна...';

  bulkResults = [];
  document.getElementById('bulk-tbody').innerHTML = '';
  document.getElementById('bulk-results').style.display = 'block';

  var prog = document.getElementById('progress');
  prog.style.display = 'block';
  prog.textContent = lines.length + ' хайлт илгээж байна...';

  fetch('/batch', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      items: lines
    })
  })
  .then(function(r) {
    return r.json();
  })
  .then(function(data) {
    var results = data.results || [];
    var tbody = document.getElementById('bulk-tbody');

    for (var i = 0; i < lines.length; i++) {
      var r = results[i] || {};

      var usernameVal = r.username || '';
      var idVal = r.id || lines[i];
      var friendsVal = r.friends || '';
      var followersVal = r.followers || '';
      var followingVal = r.following || '';
      var genderVal = r.gender || '';
      var isClosedVal = r.is_closed || '';
      var isDeletedVal = r.is_deleted || '';
      var locationVal = r.location || '';

      /* Copy хийхэд ашиглах массив (хүссэн дарааллаар) */
      bulkResults.push({
        username: usernameVal,
        id: idVal,
        friends: friendsVal,
        followers: followersVal,
        following: followingVal,
        gender: genderVal,
        is_closed: isClosedVal,
        is_deleted: isDeletedVal,
        location: locationVal
      });

      var tr = document.createElement('tr');

      var cells = [
        {
          v: String(i + 1),
          style: 'color:#aaa;font-size:11px'
        },
        {
          v: usernameVal,
          cls: hasValue(usernameVal) ? 'found' : 'notfound'
        },
        {
          v: idVal,
          style: 'color:#555'
        },
        {
          v: friendsVal,
          cls: hasValue(friendsVal) ? 'found' : 'notfound'
        },
        {
          v: followersVal,
          cls: hasValue(followersVal) ? 'found' : 'notfound'
        },
        {
          v: followingVal,
          cls: hasValue(followingVal) ? 'found' : 'notfound'
        },
        {
          v: genderVal,
          cls: genderClass(genderVal)
        },
        {
          v: isClosedVal,
          cls: isClosedVal === 'locked' ? 'is-locked' : (isClosedVal === 'open' ? 'is-not-locked' : 'notfound')
        },
        {
          v: isDeletedVal,
          cls: isDeletedVal === 'true' ? 'is-locked' : 'is-not-locked'
        },
        {
          v: locationVal,
          cls: hasValue(locationVal) ? 'location-val' : 'notfound'
        }
      ];

      cells.forEach(function(c) {
        var td = document.createElement('td');
        td.textContent = c.v || '—';
        if (c.style) {
          td.setAttribute('style', c.style);
        }
        if (c.cls) {
          td.className = c.cls;
        }
        tr.appendChild(td);
      });

      tbody.appendChild(tr);
    }

    prog.textContent = '✓ Дууслаа! ' + lines.length + ' хайлт хийлээ.';
    btn.disabled = false;
    btn.textContent = 'Хайх';
  })
  .catch(function(err) {
    console.error(err);
    prog.textContent = 'Алдаа гарлаа.';
    btn.disabled = false;
    btn.textContent = 'Хайх';
  });
}

/* =========================================================
   COPY COLUMN
========================================================= */

function copyCol(key, el) {
  var text = bulkResults
    .map(function(x) {
      return x[key] || '';
    })
    .join('\n');

  copyText(text);
  el.textContent = 'paste';
  setTimeout(function() {
    el.textContent = 'copy';
  }, 1500);
}

/* =========================================================
   COPY ALL
========================================================= */

function copyAll(btn) {
  var text = bulkResults
    .map(function(x) {
      return [
        x.username,
        x.id,
        x.friends,
        x.followers,
        x.following,
        x.gender,
        x.is_closed,
        x.is_deleted,
        x.location
      ].join('\t');
    })
    .join('\n');

  copyText(text);

  var orig = btn.textContent;
  btn.textContent = 'Хуулагдлаа!';
  setTimeout(function() {
    btn.textContent = orig;
  }, 1500);
}

</script>

</body>
</html>
